<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok 📸</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      font-size: 30px;
      font-weight: bold;
    }

    .logo {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      margin-top: 10px;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎵</div>
    <div class="title">TikTok</div>
    <div class="subtitle">Қызықты видеолар әлемі</div>

    <a class="button" href="#">
      TikTok-қа кіру
    </a>
  </header>

</body>
</html>
