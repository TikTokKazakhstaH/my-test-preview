<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 80px 15px;
    }

    .title {
      font-size: 52px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .subtitle {
      color: #aaa;
      font-size: 20px;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 40px;
      padding: 16px 35px;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <div class="title">TikTok</div>

    <div class="subtitle">
      Қызықты видеолар әлемі
    </div>

    <a class="button" href="#">
      TikTok-қа кіру
    </a>
  </header>

</body>
</html>
